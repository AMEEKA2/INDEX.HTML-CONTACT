<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vipthra</title>
<style>
body{margin:0;font-family:sans-serif;background:#fafafa;color:#000}
.header{display:flex;justify-content:space-between;padding:20px 30px;align-items:center;background:#fff;border-bottom:1px solid #eee}
.logo{font-weight:800;font-size:22px}
.nav a{margin:0 15px;text-decoration:none;color:#000}
.nav a.active{color:#ff6b4a;border-bottom:2px solid #ff6b4a}
.contact-wrapper{display:flex;gap:20px;padding:30px;flex-wrap:wrap}
.form-side{flex:1;background:#fff;padding:25px;border-radius:16px;box-shadow:0 5px 20px #0000000a}
.map-side{flex:1;border-radius:16px;overflow:hidden;min-height:380px;background:#eee}
.form-group{margin-bottom:12px;display:flex;flex-direction:column}
.form-group input,.form-group textarea{padding:12px;border-radius:10px;border:1px solid #ddd;margin-top:5px}
.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}
.submit{width:100%;background:#111;color:#fff;padding:14px;border-radius:30px;border:none;margin-top:10px;font-weight:600}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding:20px 30px 50px 30px}
.info-card{background:#fff;padding:25px;border-radius:16px;text-align:center;box-shadow:0 5px 20px #0000000a;border:1px solid #f0f0f0}
.info-icon{font-size:28px;margin-bottom:8px}
</style>
</head>
<body>

<div class="header">
  <div class="logo">Vipthra.</div>
  <div class="nav">
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#contact" class="active">Contact</a>
  </div>
  <div><a href="#contact" style="background:#111;color:#fff;padding:10px 20px;border-radius:20px;text-decoration:none;">Let's Talk</a></div>
</div>

<div class="contact-wrapper">
  <div class="form-side">
    <p style="color:#ff6b4a;font-size:12px;letter-spacing:1px">GET IN TOUCH</p>
    <h2>Let's build something great</h2><br>
    <form onsubmit="sendMessage(event)">
      <div class="form-row">
        <div class="form-group"><label>Name</label><input type="text" id="userName" required></div>
        <div class="form-group"><label>Email</label><input type="email" id="userEmail" required></div>
      </div>
      <div class="form-group"><label>Message</label><textarea id="userMsg" rows="4" required></textarea></div>
      <button class="submit" type="submit">Send Message</button>
    </form>
  </div>
  <div class="map-side">
    <iframe width="100%" height="380" frameborder="0" style="border:0" src="https://maps.google.com/maps?q=Sopore%20Jammu%20Kashmir&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
  </div>
</div>

<!-- PEHLE JAISE 3 CARDS NICHE -->
<div class="info-grid">
  <a href="mailto:hello@vipthra.com" style="text-decoration:none;color:inherit;">
    <div class="info-card">
      <div class="info-icon">✉️</div>
      <h3>Email Us</h3>
      <p>hello@vipthra.com</p>
    </div>
  </a>
  <a href="tel:+919876543210" style="text-decoration:none;color:inherit;">
    <div class="info-card">
      <div class="info-icon">📞</div>
      <h3>Call Us</h3>
      <p>+91 98765 43210</p>
    </div>
  </a>
  <a href="https://maps.google.com/?q=Sopore" target="_blank" style="text-decoration:none;color:inherit;">
    <div class="info-card">
      <div class="info-icon">📍</div>
      <h3>Visit Us</h3>
      <p>Sopore, J&K, India</p>
    </div>
  </a>
</div>

<script>
function sendMessage(e){
 e.preventDefault();
 let n=document.getElementById('userName').value;
 let em=document.getElementById('userEmail').value;
 let m=document.getElementById('userMsg').value;
 window.location.href="mailto:hello@vipthra.com?subject=New message from "+n+"&body="+m+"%0AEmail:"+em;
}
</script>
</body>
</html>
